<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>KDK Quant Engine - Signal Dashboard</title><link rel="stylesheet" href="assets/app.css"></head>
<body><main class="app"><header><div><h1>KDK Quant Engine</h1><p>Signal Dashboard</p></div></header>
<section class="filters collapsed" id="filters"><button id="filterToggle" aria-expanded="false"><span><b>表示条件</b><small id="summary"></small></span><span>∨</span></button><div class="filterBody">
<fieldset><legend>分析期間</legend><div id="periods" class="tabs"></div></fieldset><fieldset><legend>セッション</legend><div class="tabs" data-key="session"><button data-value="DAY">ザラ場</button><button data-value="EVENING">夕場</button></div></fieldset>
<fieldset><legend>分析種別</legend><div class="tabs" data-key="analysisType"><button data-value="STANDARD">通常</button><button data-value="CROSS">CROSS</button></div></fieldset><fieldset><legend>売買方向</legend><div class="tabs" data-key="direction"><button data-value="LONG">LONG</button><button data-value="SHORT">SHORT</button></div></fieldset></div></section>
<section id="message" class="message hidden"></section><article id="card" class="card hidden"><div class="cardTop"><span id="direction" class="badge"></span><b>ランキング 1位</b></div><h2 id="ruleId"></h2>
<div class="metrics"><div><small>PF</small><strong id="pf"></strong></div><div><small>勝率</small><strong id="win"></strong></div><div><small>平均損益</small><strong id="avg"></strong></div></div>
<section><h3>ENTRY条件</h3><div id="conditionText" class="formula"></div><p id="timing" class="note"></p></section><section><h3>利確 / 損切条件</h3><div id="exit"></div></section>
<section><h3>ENTRY判定用の値</h3><div id="inputs"></div><div class="actions"><button id="save">入力値を保存</button><button id="reset" class="secondary">入力値をリセット</button></div><p id="saveState" class="saveState"></p></section>
<section><h3>ENTRY判定</h3><button id="evaluation" class="evaluation waiting"></button><div id="calculation" class="calculation hidden"></div></section><section><h3>年別確認</h3><div id="years" class="years"></div></section></article>
<dialog id="resetDialog"><h2>入力値をリセットしますか？</h2><p id="resetMessage"></p><div class="actions"><button id="cancelReset" class="secondary">キャンセル</button><button id="confirmReset" class="danger">リセット</button></div></dialog>
</main><script type="module" src="assets/app.js"></script></body></html>
