<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>KDK Quant Engine - Signal Dashboard</title><link rel="stylesheet" href="assets/app.css?v=728c8e77602d"><link rel="stylesheet" href="assets/usability.css?v=728c8e77602d"></head>
<body><main class="app"><header><div><h1>KDK Quant Engine</h1><p>Signal Dashboard</p><small id="screenUpdatedAt">バッチ更新 --</small></div></header>
<section class="filters collapsed" id="filters"><button id="filterToggle" aria-expanded="false"><span><b>表示条件</b><small id="summary"></small></span><span class="filterToggleIcon" aria-hidden="true">＋</span></button><div class="filterBody">
<fieldset><legend>分析期間</legend><div id="periods" class="tabs"></div></fieldset><fieldset><legend>セッション</legend><div class="tabs" data-key="session"><button data-value="DAY">ザラ場</button><button data-value="EVENING">夕場</button></div></fieldset>
<fieldset><legend>分析種別</legend><div class="tabs" data-key="analysisType"><button data-value="STANDARD">通常</button><button data-value="CROSS">CROSS</button></div></fieldset><fieldset><legend>売買方向</legend><div class="tabs" data-key="direction"><button data-value="LONG">LONG</button><button data-value="SHORT">SHORT</button></div></fieldset></div><nav class="quickSwitch" aria-label="分析種別のクイック切替"><div class="tabs" data-key="analysisType"><button data-value="STANDARD">通常</button><button data-value="CROSS">CROSS</button></div><small>カードを左右にスワイプしてLONG／SHORTを切り替え</small></nav></section>
<div id="swipeSurface" class="swipeSurface"><section id="message" class="message hidden"></section><article id="card" class="card hidden"><div class="cardTop"><span id="direction" class="badge"></span><b>ランキング 1位</b><button id="evaluationShortcut" class="evaluationShortcut waiting" type="button">待機</button></div><h2 id="ruleId"></h2>
<div id="confirmationSelector" class="confirmationSelector hidden"></div><div class="metrics"><div><small>PF <button class="info" data-tip="Profit Factor。総利益を総損失で割った利益効率です。">i</button></small><strong id="pf"></strong></div><div><small>勝率 <button class="info" data-tip="対象期間の取引のうち、損益がプラスだった割合です。">i</button></small><strong id="win"></strong></div><div><small>平均損益 <button class="info" data-tip="対象期間の1取引あたり平均損益です。">i</button></small><strong id="avg"></strong></div><div><small>取引回数 <button class="info" data-tip="選択した条件に該当した取引の件数です。">i</button></small><strong id="trades"></strong></div></div><div id="comparison" class="comparison hidden"></div>
<section><h3>ENTRY条件 <button class="info" data-tip="ランキング1位Ruleの条件です。条件に使う値と計算方法は下のENTRY判定用の値で確認できます。">i</button></h3><div id="conditionText" class="formula"></div><p id="timing" class="note"></p></section><section><h3>利確 / 損切条件 <button class="info" data-tip="利確価格は利益を確定する価格、損切価格は損失を限定する価格です。画面には採用された方式と、売買方向に応じた価格の決め方を表示します。">i</button></h3><div id="exit" class="exitHelp"></div></section>
<section><h3>ENTRY判定用の値 <button class="info" data-tip="AUTOはバッチ更新時点で確定した対象セッションの市場値、INPUTは手入力または未確定の値です。">i</button></h3><div id="inputs"></div><div class="actions"><button id="entrySave">入力値を保存</button><button id="entryRestoreSaved" class="secondary">保存値に戻す</button><button id="entryReset" class="secondary">初期値に戻す</button><button id="entryClear" class="secondary">入力値をクリア</button></div><p id="saveState" class="saveState"></p></section>
<section><h3>ENTRY判定 <button class="info" data-tip="タップすると、使用した値、計算式、閾値との比較結果を表示します。">i</button></h3><button id="evaluation" class="evaluation waiting"></button><div id="calculation" class="calculation hidden"></div></section><section><h3>年別確認 <button class="info" data-tip="分析レポートの年別確認と同じ、基準達成、取引回数、PF、平均損益を表示します。">i</button></h3><div id="years" class="years"></div></section></article></div>
<dialog id="resetDialog"><h2>初期値に戻しますか？</h2><p id="resetMessage"></p><div class="actions"><button id="cancelReset" class="secondary">キャンセル</button><button id="confirmReset" class="danger">初期値に戻す</button></div></dialog>
<dialog id="clearDialog"><h2>入力値をクリアしますか？</h2><p id="clearMessage"></p><div class="actions"><button id="cancelClear" class="secondary">キャンセル</button><button id="confirmClear" class="danger">入力値をクリア</button></div></dialog>
<div id="saveFeedback" class="saveFeedback" role="status" aria-live="polite" aria-atomic="true"></div>
</main><script type="module" src="assets/app.js?v=728c8e77602d"></script></body></html>
